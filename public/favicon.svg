<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:wght@400;600&amp;family=DM+Sans:wght@500;600&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Top Line: "The Video" (Centered horizontally with 70px margin on both left and right) -->
  <text x="70" y="242" fill="#FFFFFF" font-family="'Alex Brush', 'Brush Script MT', cursive" font-size="94" font-style="italic">The</text>
  <text x="180" y="248" fill="#FFFFFF" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="108" font-weight="300" letter-spacing="-2">Video</text>

  <!-- Bottom Line: "BY EVHENIA CHIRVA" (Dead-centered at X=256) -->
  <text x="256" y="308" fill="#FFFFFF" fill-opacity="0.75" font-family="'DM Sans', 'Inter', sans-serif" font-size="23" font-weight="600" letter-spacing="6.5" text-anchor="middle">BY EVHENIA CHIRVA</text>
</svg>