<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cormorant+Garamond:wght@400;600&amp;display=swap');
    </style>
    <!-- Ink spray dark radial gradient matching reference image -->
    <radialGradient id="inkRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0A0A0A" stop-opacity="0.98"/>
      <stop offset="85%" stop-color="#18181B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Deep ink background card -->
  <rect width="512" height="512" rx="116" fill="url(#inkRadial)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Monogram EC -->
  <g transform="translate(15, 0)">
    <!-- Cursive 'E' -->
    <text x="130" y="338" fill="#FFFFFF" font-family="'Alex Brush', 'Brush Script MT', cursive" font-size="285" font-style="italic">E</text>

    <!-- Serif 'C' interlocking on the right -->
    <text x="210" y="344" fill="#FFFFFF" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="255" font-weight="400">C</text>
  </g>
</svg>