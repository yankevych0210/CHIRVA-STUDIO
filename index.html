<!doctype html>
<html lang="uk" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Женя Чирва — контент-мейкерка: Reels, UGC та фото для брендів</title>
    <meta name="description" content="Естетичні Reels, UGC-відео, предметна та lifestyle фотозйомка для брендів одягу, косметики й закладів. Кременчук та онлайн по всьому світу." />
    <meta name="author" content="Женя Чирва" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Browser UI -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Chirva" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:site_name" content="The Video by Evhenia Chirva" />
    <meta property="og:title" content="Женя Чирва — Reels, UGC та фото для брендів" />
    <meta property="og:description" content="Контент, який естетизує бренд та працює на охоплення. Портфоліо, послуги та прайс." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Женя Чирва — Reels, UGC та фото для брендів" />
    <meta name="twitter:description" content="Контент, який естетизує бренд та працює на охоплення." />
    <!--app-head-->

    <!-- LCP image: start downloading the hero photo before CSS/JS are parsed -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high"
      href="/images/hero-960.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-960.webp 960w"
      imagesizes="(min-width: 640px) 420px, calc(100vw - 2.5rem)" />

    <!-- Scroll-reveal animations are enabled only when JS runs; if the bundle
         fails to load, content becomes visible after 3s instead of staying hidden -->
    <script>
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__appReady) document.documentElement.classList.remove('js');
      }, 3000);
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
